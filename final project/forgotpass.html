<!Doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <section>
        <div class="forgot-page">
            <div class="container mt-5 mb-5">
                <form id="forgotForm">
                    <div class="forgot d-flex shadow">
                        <div class="forgot-img">
                            <img src="./images/381895e7243068f4aa1e91ad714c8fc6f108c2f4.jpg" alt="">
                        </div>
                        <div class="forgot-content">
                            <div class="back mb-4" id="forgotBack">
                                <i class="fa-solid fa-chevron-left"></i>
                                <span>Back</span>
                            </div>
                            <h1>Forgot Password</h1>
                            <p class="please bio-forgot">Enter your registered email address. we’ll send you a code to
                                reset your
                                password.</p>
                            <div class="input d-flex">
                                <label for="">Email Address</label>
                                <input type="email" placeholder="Enter Your Email" id="forgotEmail" required>
                            </div>
                            <div class="submit-button">
                                <button type="submit">Send OTP</button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="Js/script.js"></script>
</body>

</html>
