<!Doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <section>
        <div class="register-page">
            <div class="container mt-5 mb-5">
                <form id="registerForm">
                    <div class="register d-flex shadow">
                        <div class="register-img">
                            <img src="./images/2ac92ecabfbbc6d8300995990bb423eb6b3c1ace.jpg" alt="">
                        </div>
                        <div class="register-content">
                            <h1>Create New Account</h1>
                            <p class="please">Please enter details</p>
                            <div class="input d-flex">
                                <label for="">First Name</label>
                                <input type="text" id="firstName" placeholder="Enter Your First Name" required>
                            </div>
                            <div class="input d-flex">
                                <label for="">Last Name</label>
                                <input type="text" id="lastName" placeholder="Enter Your Last Name" required>
                            </div>
                            <div class="input d-flex">
                                <label for="">Email Address</label>
                                <input type="email" id="registerEmail" placeholder="Enter Your Email" required>
                            </div>
                            <div class="input d-flex">
                                <label for="">Password</label>
                                <input type="password" id="registerPassword" placeholder="Enter Your Password" required>
                            </div>
                            <div class="register-details d-flex">
                                <div class="remember-check">
                                    <input type="checkbox"  id="terms" required>
                                    <label for="">I agree to the <span class="fw-bold">Terms & Conditions</span></label>
                                </div>
                            </div>
                            <div class="submit-button">
                                <a href=""><button type="submit">Sign Up</button></a>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="Js/script.js"></script>
</body>

</html>
