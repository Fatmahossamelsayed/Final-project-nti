<!Doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <section>
        <div class="changepass-page">
            <div class="container mt-5 mb-5">
                <form id="changePasswordForm">
                    <div class="OTP-Code d-flex shadow">
                        <div class="OTP-layer"></div>
                        <div class="OTP-img">
                            <img src="./images/17a980ed1381b6c12a4843ef7f71eb0311fdbf2d.jpg" alt="">
                        </div>
                        <div class="OTP-content">
                            <div class="back mb-4" id="changePasswordBack">
                                <i class="fa-solid fa-chevron-left"></i>
                                <span>Back</span>
                            </div>
                            <h1>Enter OTP</h1>
                            <p class="please bio-OTP mb-4">We have share a code of your registered email address
                                robertfox@example.com</p>
                            <div class="OTP-input d-flex">
                                <input type="text" maxlength="1" pattern="[0-9]">
                                <input type="text" maxlength="1" pattern="[0-9]">
                                <input type="text" maxlength="1" pattern="[0-9]">
                                <input type="text" maxlength="1" pattern="[0-9]">
                                <input type="text" maxlength="1" pattern="[0-9]">
                            </div>
                            <div class="submit-button">
                                <a href=""><button>Verify</button></a>
                            </div>
                        </div>
                        <div class="OTP-layer-content"  id="successMessage">
                            <i class="fa-solid fa-circle-check"></i>
                            <h5>Password Changed Successfully</h5>
                            <p>Your password has been updated successfully</p>
                            <div class="submit-button">
                                <button type="button" id="backToLogin">Back to Login</button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="Js/script.js"></script>
</body>

</html>
