<!Doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <section>
        <div class="login-page">
            <div class="container mt-5 mb-5">
                <form id="loginForm">
                    <div class="login d-flex shadow">
                        <div class="login-img">
                            <img src="./images/040cc45a2d79166cf646d5a5a0119f93bceae506.jpg" alt="">
                        </div>
                        <div class="login-content">
                            <h1>Welcome 👋</h1>
                            <p class="please">Please login here</p>
                            <div class="input d-flex">
                                <label for="">Email Address</label>
                                <input type="email" placeholder="Enter Your Email" id="loginEmail" required>
                            </div>
                            <div class="input d-flex">
                                <label for="">Password</label>
                                <input type="password" placeholder="Enter Your Password" id="loginPassword" required>
                            </div>
                            <div class="login-details d-flex">
                                <div class="remember-check">
                                    <input type="checkbox" required>
                                    <label for="">Remember Me</label>
                                </div>
                                <a href="forgotpass.html">Forgot Password?</a>
                            </div>
                            <div class="submit-button">
                                <button type="submit">Login</button>
                            </div>
                            <h6>Or</h6>
                            <div class="submit-button">
                                <a href="register.html">
                                    <button type="button">Create new Account</button>
                                </a>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="Js/script.js"></script>
</body>

</html>
